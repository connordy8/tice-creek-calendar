name: Sync Tice Creek Schedule

on:
  # Every 3 hours, 6 AM - 9 PM Pacific, so class availability ("sign up
  # · 4 left", "FULL · waitlist") stays fresh. Sign-up windows open at
  # 8 AM, so the 9 AM run flips "sign-up opens ..." to "sign up".
  # UTC hours below are PDT; in PST everything shifts an hour earlier.
  schedule:
    - cron: "17 13,16,19,22,1,4 * * *"   # :17, off GitHub's busy :00

  # Allow manual trigger (check-email.yml also triggers this after it
  # records a forwarded appointment)
  workflow_dispatch:

  # Also run on pushes to main (for testing config changes)
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "scraper.py"
      - "gcal_sync.py"
      - "tice_schedule.py"
      - "movie_info.py"
      - "manual_events.json"

permissions:
  contents: write   # commit movie_info.json / manual_events.json
  actions: write    # keep-alive: re-enable scheduled workflows

# Prevent overlapping with email handler (both push to same repo)
concurrency:
  group: calendar-updates
  cancel-in-progress: false

env:
  TZ: America/Los_Angeles

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub silently disables scheduled workflows after 60 days with
      # no commits. That happened in Aug 2026 and nothing synced for
      # two months. Re-enabling via the API resets the clock.
      - name: Keep scheduled workflows alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in sync.yml check-email.yml zumba-autobook.yml; do
            gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY" || echo "couldn't enable $wf"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # No browser needed: Tice Creek and Rossmoor are both plain HTTP
      - name: Install dependencies
        run: pip install pyyaml anthropic google-auth google-api-python-client pdfplumber

      # A Gmail/Anthropic hiccup must not block the calendar sync.
      # check-email.yml handles email every 15-30 min anyway.
      - name: Check email for calendar updates
        continue-on-error: true
        env:
          CALENDAR_EMAIL: bethcalendarupdate@gmail.com
          CALENDAR_EMAIL_PASSWORD: ${{ secrets.CALENDAR_EMAIL_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python email_handler.py

      # Each source syncs independently; this step goes red if any
      # source failed, after syncing everything that worked.
      - name: Scrape and sync calendar
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python scraper.py

      - name: Upload debug artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: debug/
          retention-days: 7

      - name: Commit movie cache / email updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manual_events.json movie_info.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update calendar data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase --autostash && git push
          fi
          # Backup keep-alive: GitHub's 60-day inactivity rule counts
          # commits, so if nothing has been committed in 45 days, push an
          # empty heartbeat commit (at most one every ~45 days).
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "Keep-alive heartbeat [$(date -u +'%Y-%m-%d')]"
            git pull --rebase --autostash && git push
          fi
