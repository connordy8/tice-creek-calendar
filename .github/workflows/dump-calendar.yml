name: Dump Beth Calendar

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-auth google-api-python-client

      - name: Dump next 7 days
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          python3 -c "
          import json, os
          from datetime import datetime, timedelta
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_KEY']),
              scopes=['https://www.googleapis.com/auth/calendar.readonly'])
          svc = build('calendar', 'v3', credentials=creds, cache_discovery=False)

          now = datetime.utcnow()
          resp = svc.events().list(
              calendarId=os.environ['GOOGLE_CALENDAR_ID'],
              timeMin=now.isoformat() + 'Z',
              timeMax=(now + timedelta(days=7)).isoformat() + 'Z',
              maxResults=100,
              singleEvents=True,
              orderBy='startTime',
          ).execute()

          print('=' * 60)
          print('BETH CALENDAR — NEXT 7 DAYS')
          print('=' * 60)
          for e in resp.get('items', []):
              dt = e.get('start', {}).get('dateTime', e.get('start', {}).get('date', ''))
              print(f'{dt:30s}  {e.get(\"summary\", \"(no title)\")}')
          print(f'Total: {len(resp.get(\"items\", []))} events')
          "
