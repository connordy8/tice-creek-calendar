name: Schema Canary

on:
  # Twice daily: 9 AM PT and 9 PM PT (16:00 and 04:00 UTC). Catches
  # both morning gaps (post-overnight booking) and evening gaps
  # (after the daytime sweep).
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: America/Los_Angeles

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyyaml

      - name: Run canary
        env:
          CALENDAR_EMAIL: bethcalendarupdate@gmail.com
          CALENDAR_EMAIL_PASSWORD: ${{ secrets.CALENDAR_EMAIL_PASSWORD }}
          ALERT_EMAIL: connordy@gmail.com
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          pip install google-auth google-api-python-client
          python canary.py
