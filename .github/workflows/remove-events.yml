name: Remove Events by Keyword

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Delete events containing this keyword (case-insensitive)'
        required: true

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install google-auth google-api-python-client
      - name: Remove matching events
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          python3 -c "
          import json, os
          from datetime import datetime, timedelta
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          keyword = '${{ inputs.keyword }}'.lower()
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_KEY']),
              scopes=['https://www.googleapis.com/auth/calendar'])
          svc = build('calendar', 'v3', credentials=creds, cache_discovery=False)
          cal = os.environ['GOOGLE_CALENDAR_ID']

          now = datetime.utcnow()
          resp = svc.events().list(
              calendarId=cal,
              timeMin=(now - timedelta(days=1)).isoformat() + 'Z',
              timeMax=(now + timedelta(days=30)).isoformat() + 'Z',
              maxResults=500,
              singleEvents=True,
          ).execute()

          deleted = 0
          for e in resp.get('items', []):
              summary = (e.get('summary') or '').lower()
              if keyword in summary and e.get('status') != 'cancelled':
                  try:
                      svc.events().delete(calendarId=cal, eventId=e['id']).execute()
                      deleted += 1
                      print(f'Deleted: {e.get(\"summary\", \"?\")}')
                  except Exception as ex:
                      print(f'Failed: {ex}')

          print(f'Removed {deleted} events matching \"{keyword}\"')
          "
