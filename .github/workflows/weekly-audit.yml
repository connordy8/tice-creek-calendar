name: Weekly Calendar Audit

# DISABLED FROM SCHEDULE 2026-05-25 — Connor's directive: 'Stop
# sending me these alerts.' This audit's logic predates the booking
# disablement. It compares 'what's on Mindbody' to 'what's on Beth's
# calendar' and treats missing entries as gaps requiring action.
#
# That doesn't make sense anymore: Beth opted out of auto-booking
# and signs up for things herself, so anything she DIDN'T sign up
# for is intentional — not a gap. The audit will always find 'gaps'
# in the new world.
#
# Kept available as a manual-only workflow_dispatch in case it's
# useful for debugging in the future. No cron trigger.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to audit"
        required: true
        default: "7"

permissions:
  contents: write   # scraper.py commits its output ICS
  actions: write    # to dispatch the auto-book workflow

env:
  TZ: America/Los_Angeles

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium
          pip install google-auth google-api-python-client pyyaml

      # ── Self-heal step 1: refresh scraper data ──
      - name: Refresh Mindbody scrape
        env:
          MINDBODY_USERNAME: ${{ secrets.MINDBODY_USERNAME }}
          MINDBODY_PASSWORD: ${{ secrets.MINDBODY_PASSWORD }}
        run: python scraper.py || echo "scraper failed — audit will fail loudly below"
        continue-on-error: true

      # ── Self-heal step 2: run auto-book inline to fill gaps ──
      # We run it in this same job (not via dispatch) so the audit
      # below reflects the post-self-heal state of the calendar.
      - name: Run auto-book inline to attempt missing bookings
        env:
          MINDBODY_EMAIL: ${{ secrets.MINDBODY_EMAIL }}
          MINDBODY_PASSWORD: ${{ secrets.MINDBODY_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python auto_book.py 7 || echo "auto-book failed — audit will report what's missing"
        continue-on-error: true

      # ── Run the audit ──
      - name: Run audit
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          CALENDAR_EMAIL: bethcalendarupdate@gmail.com
          CALENDAR_EMAIL_PASSWORD: ${{ secrets.CALENDAR_EMAIL_PASSWORD }}
          ALERT_EMAIL: connordy@gmail.com
        run: python weekly_audit.py --days ${{ inputs.days || '7' }}
