name: Check Email Updates

on:
  # Every 30 minutes during waking hours (8am-9pm Pacific)
  # Covers both PST (16:00-05:00 UTC) and PDT (15:00-04:00 UTC)
  schedule:
    - cron: "0,30 15-23 * * *"
    - cron: "0,30 0-5 * * *"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      reprocess_since:
        description: 'Re-run on all emails since YYYY-MM-DD, read or not (recovery; dedup prevents duplicates)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write    # keep-alive + trigger sync after new events

# Prevent overlapping with sync workflow (both push to same repo)
concurrency:
  group: calendar-updates
  cancel-in-progress: false

env:
  TZ: America/Los_Angeles

jobs:
  check-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # See sync.yml: GitHub disables scheduled workflows after 60 days
      # without commits. Each workflow keeps the other alive.
      - name: Keep scheduled workflows alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in sync.yml check-email.yml; do
            gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY" || echo "couldn't enable $wf"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install pyyaml anthropic

      - name: Check email for calendar updates
        env:
          CALENDAR_EMAIL: bethcalendarupdate@gmail.com
          CALENDAR_EMAIL_PASSWORD: ${{ secrets.CALENDAR_EMAIL_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPROCESS_SINCE: ${{ inputs.reprocess_since }}
        run: python email_handler.py ${REPROCESS_SINCE:+--reprocess-since "$REPROCESS_SINCE"}

      - name: Commit email updates if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manual_events.json
          if [ ! -f manual_events.json ]; then
            echo "No manual events file created"
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "No new email updates"
          else
            git commit -m "Email calendar update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase --autostash && git push
            # Pushes made with GITHUB_TOKEN don't trigger workflows, so
            # kick the calendar sync explicitly.
            gh workflow run sync.yml --repo "$GITHUB_REPOSITORY" || echo "couldn't trigger sync"
          fi
