name: Calendar Healthcheck

on:
  # CRON DISABLED 2026-05-27 — same outdated logic as the weekly
  # audit. healthcheck.py alerts when no fitness classes are found
  # on Beth's calendar, but auto-booking is intentionally off so
  # 'no fitness classes booked' is the new normal. Manual dispatch
  # only.
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install google-auth google-api-python-client pyyaml

      - name: Run healthcheck
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          CALENDAR_EMAIL: bethcalendarupdate@gmail.com
          CALENDAR_EMAIL_PASSWORD: ${{ secrets.CALENDAR_EMAIL_PASSWORD }}
          ALERT_EMAIL: connordy@gmail.com
        run: python healthcheck.py

