name: Auto-Book Classes

on:
  # Aggressive schedule to catch Mindbody's booking window the moment
  # it opens. New days become bookable 7 days in advance — hitting
  # midnight + early morning greatly increases odds of confirmed (vs
  # waitlisted) spots, especially for popular classes.
  #
  # Pacific Time schedule (converted to UTC):
  #   12:00 AM PT  (07:00 UTC) — catches midnight-open windows
  #   12:15 AM PT  (07:15 UTC) — retry
  #   12:30 AM PT  (07:30 UTC) — retry
  #   01:00 AM PT  (08:00 UTC) — retry
  #   05:00 AM PT  (12:00 UTC) — catches 5 AM-open windows
  #   05:15 AM PT  (12:15 UTC) — retry
  #   05:30 AM PT  (12:30 UTC) — retry
  #   06:00 AM PT  (13:00 UTC)
  #   06:30 AM PT  (13:30 UTC)
  #   07:00 AM PT  (14:00 UTC)
  #   08:00 AM PT  (15:00 UTC)
  #   10:00 AM PT  (17:00 UTC)
  #   12:00 PM PT  (19:00 UTC)
  #   02:00 PM PT  (21:00 UTC)
  #   04:00 PM PT  (23:00 UTC)
  #   06:00 PM PT  (01:00 UTC)
  #   08:00 PM PT  (03:00 UTC)
  #   10:00 PM PT  (05:00 UTC)
  schedule:
    # Conservative schedule — Mindbody flags accounts that book too
    # aggressively. Aim for ~6 runs/day total, focused on the two
    # likely opening windows (midnight + 6 AM PT) plus a couple of
    # daytime sweeps.
    - cron: "0,15 7 * * *"     # 12:00 + 12:15 AM PT — midnight window
    - cron: "0,15 13 * * *"    # 6:00 + 6:15 AM PT — early window
    - cron: "0 17 * * *"       # 10 AM PT — morning sweep
    - cron: "0 23 * * *"       # 4 PM PT — afternoon sweep

  # Allow manual trigger
  workflow_dispatch:

# Prevent overlapping runs — if a run is in progress, queue the next one
concurrency:
  group: auto-book
  cancel-in-progress: false

env:
  TZ: America/Los_Angeles

jobs:
  auto-book:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Auto-book classes
        env:
          MINDBODY_EMAIL: ${{ secrets.MINDBODY_EMAIL }}
          MINDBODY_PASSWORD: ${{ secrets.MINDBODY_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python auto_book.py 7

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-book-debug-${{ github.run_number }}
          path: debug/
          retention-days: 3

