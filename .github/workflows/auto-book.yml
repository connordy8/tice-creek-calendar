name: Auto-Book Classes

on:
  # RETIRED Oct 2026 (manual-only). Booking has been disabled since
  # May 2026 and Mindbody's login page changed, so this script can't
  # log in. Class listings now come from scraper.py (sync.yml) via
  # tice_schedule.py, which needs no login. Re-adding a schedule here
  # would create duplicate "available" class events.

  # Allow manual trigger
  workflow_dispatch:

# Prevent overlapping runs — if a run is in progress, queue the next one
concurrency:
  group: auto-book
  cancel-in-progress: false

env:
  TZ: America/Los_Angeles

jobs:
  auto-book:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Auto-book classes
        env:
          MINDBODY_EMAIL: ${{ secrets.MINDBODY_EMAIL }}
          MINDBODY_PASSWORD: ${{ secrets.MINDBODY_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python auto_book.py 7

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-book-debug-${{ github.run_number }}
          path: debug/
          retention-days: 3

