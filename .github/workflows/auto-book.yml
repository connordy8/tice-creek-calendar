name: Auto-Book Classes

on:
  # Run every 2 hours during waking hours (Pacific)
  # UTC hours: 15-05 = 7 AM - 9 PM Pacific
  schedule:
    - cron: "0 15,17,19,21,23 * * *"
    - cron: "0 1,3,5 * * *"
    - cron: "30 13 * * *"

  # Allow manual trigger
  workflow_dispatch:

env:
  TZ: America/Los_Angeles

jobs:
  auto-book:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Auto-book classes
        env:
          MINDBODY_EMAIL: ${{ secrets.MINDBODY_EMAIL }}
          MINDBODY_PASSWORD: ${{ secrets.MINDBODY_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python auto_book.py 14

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-book-debug-${{ github.run_number }}
          path: debug/
          retention-days: 3

      - name: Send failure alert
        if: failure()
        env:
          CALENDAR_EMAIL: bethcalendarupdate@gmail.com
          CALENDAR_EMAIL_PASSWORD: ${{ secrets.CALENDAR_EMAIL_PASSWORD }}
          ALERT_EMAIL: connordy@gmail.com
        run: python notify.py --alert "Auto-Book" "Class booking workflow failed. Beth's classes may not be reserved."
