# ============================================================
# Tice Creek Calendar Sync – Beth's Preferences
# ============================================================
# List: Zumba (her favorite, incl. Zumba Club Tue/Thu 9:45am), UJAM,
#       Aquacise, Water Aerobics, Posture Balance, Mat Yoga,
#       Functional Strength/Fitness, ForeverFit, Let's Stretch,
#       Strength & Stretch/Flexibility, Pilates Mat
# NOT: Tai Chi (removed Oct 2026), Pickleball (removed Apr 2026)
# Only list: classes at 11am or later, except Zumba (any time)
# Beth signs up herself; the calendar shows whether sign-up is needed
# and how many spots are left.
# Exception: some classes are auto-booked; see `autobook` below.
# ============================================================

calendar_name: "Tice Creek – Beth's Classes"

# Class types to include (case-insensitive, partial match)
# Use a string for any instructor, or {name: ..., instructor: ...} to filter
include_classes:
  - "zumba"
  - "ujam"
  - "aquacise"
  - "water aerobics"     # "Water Aerobics" + "Aqua: Deep Water Aerobics"
  - "posture"
  - "mat yoga"
  - "foreverfit"
  - "forever fit"
  - "functional strength"
  - "functional fitness"
  - "strength and stretch"
  - "strength stretch"
  - "strength and flexibility"
  - "strength flexibility"
  - "pilates mat"
  - "let's stretch"
  - "lets stretch"

# Classes to exclude
exclude_classes:
  - "cancelled"
  - "introduction to"    # equipment orientations, not classes
  - "pickleball"         # explicitly removed Apr 2026
  - "tai chi"            # explicitly removed Oct 2026

# Only show classes at 11am or later
earliest_hour: 11

# Per-class exceptions to earliest_hour (matched against class name)
earliest_hour_overrides:
  zumba: 0     # her favorite: list every Zumba, incl. 9:45am Zumba Club

# Start events 15 min early so Beth has travel time
# (real class time still shown in the event description)
early_start_minutes: 15

# --- Auto-booking (autobook.py, workflow autobook.yml) ---
# The calendar bot signs Beth up for these classes. Connor's rules,
# Oct 2026: don't hoard spots (Tice Creek staff don't like people
# signing up for lots of future classes), so book only the day before,
# or sooner once a class is down to its last couple of spots.
autobook:
  enabled: true              # false = stop all auto-booking (the off switch)
  # Priority order: when more qualify on a day than max_per_day allows,
  # earlier entries win. Matched against the Mindbody class name (and
  # instructor, whole word) case-insensitively. Club/drop-in classes
  # and exclude_classes are never booked.
  classes:
    - name: "zumba"
    - name: "ujam"
    - name: "aquacise"
      instructor: "bob huff" # only Bob's; she doesn't like the others
    - name: "posture"        # Posture, Balance, Core and Strength
    - name: "mat yoga"
  earliest_hour: 11          # never book a class starting before 11 AM
  book_days_ahead: 1         # book the day before...
  max_spots_left: 2          # ...or sooner once down to this many spots
  max_per_day: 2             # at most 2 classes a day (hers count too);
                             # at most 1 of each class (the latest)
  buffer_minutes: 15         # gap needed between classes/appointments
  min_lead_minutes: 120      # never book a class starting sooner
  signin_reset: 0            # after a sign-in pause (wrong password etc.),
                             # change to any new number to try again

# Custom display names (matched by class name + instructor)
# Format: { match_name: "...", match_instructor: "...", title: "..." }
custom_titles:
  - match_name: "zumba"
    match_instructor: "sabrina"
    title: "Zumba w/ Sabrina"
  - match_name: "aquacise"
    match_instructor: "bob"
    title: "Aquacise w/ Bob"

# Default class duration if end time isn't scraped (minutes)
default_class_duration_minutes: 45

# --- Rossmoor Entertainment Settings ---
# Scrape the Peacock Hall movie & concert calendar from myrossmoor.com
include_movies: true
include_concerts: true

# Only include movie showings at or after this hour: Beth wants the
# 7 PM and 9 PM shows only. Titles get the Rotten Tomatoes score;
# descriptions get a short plot summary (cached in movie_info.json).
movie_earliest_hour: 19

# Concerts/special events at or after this hour (18 = 6 PM)
concert_earliest_hour: 18

# Default movie duration in minutes (most are ~2 hours)
movie_duration_minutes: 135

# Default concert duration in minutes
concert_duration_minutes: 120

# --- Output Settings ---
# Single combined ICS file — everything appears on one calendar for Beth
output_dir: "docs"
combined_filename: "beth-calendar.ics"
